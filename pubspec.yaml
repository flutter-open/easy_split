name: easy_split
description: "EasySplit: parallel-view split layout for foldables and tablets. One route stack; narrow screens stay full width, wide screens split into two panes, no page code changes."
version: 0.2.1
repository: https://github.com/flutter-open/easy_split
topics:
  - foldable
  - tablet
  - split-screen
  - adaptive-layout
  - navigation
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.27.0" # requestFocus passthrough requires Flutter 3.27+
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
