name: Issue / PR → WeCom

# 把仓库的 Issue 与 Pull Request 动态推送到企业微信群机器人。
# 需要在仓库 Secrets 中配置 WECOM_WEBHOOK_URL（见下方注释），密钥不会写进代码库。

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, closed, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      title:
        description: 测试消息标题
        required: false
        default: EasySplit 企业微信机器人连通性测试

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: wecom-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send markdown to WeCom
        env:
          # 仓库 Settings -> Secrets and variables -> Actions -> New repository secret
          # 名称：WECOM_WEBHOOK_URL
          # 值：  https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=***
          WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::error::缺少 WECOM_WEBHOOK_URL secret，请先到仓库 Settings -> Secrets and variables -> Actions 中添加。"
            exit 1
          fi

          # 摘要：压平换行、去掉首尾空白并截断，避免超出企业微信 4096 字节上限。
          flatten() {
            printf '%s' "$1" | tr '\r\n' '  ' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//'
          }
          clip() {
            local text="$1" max="${2:-260}"
            if [ "${#text}" -gt "$max" ]; then
              printf '%s…（已截断）' "${text:0:$max}"
            else
              printf '%s' "$text"
            fi
          }

          title="${INPUT_TITLE:-}"
          url="https://github.com/${REPO}"
          actor="${GITHUB_ACTOR:-workflow}"
          body=""
          labels=""
          ref=""
          kind="更新"
          color="info"

          case "${EVENT_NAME}" in
            issues)
              title="${ISSUE_TITLE}"
              url="${ISSUE_URL}"
              actor="${ISSUE_USER}"
              body="$(flatten "${ISSUE_BODY:-}")"
              labels="${ISSUE_LABELS:-}"
              ref="${REPO}#${ISSUE_NUMBER}"
              case "${ACTION}" in
                opened)   kind="🐛 新 Issue";      color="info" ;;
                reopened) kind="🔄 Issue 重新打开"; color="warning" ;;
                closed)   kind="✅ Issue 已关闭";   color="comment" ;;
              esac
              ;;
            pull_request)
              title="${PR_TITLE}"
              url="${PR_URL}"
              actor="${PR_USER}"
              body="$(flatten "${PR_BODY:-}")"
              labels="${PR_LABELS:-}"
              ref="${REPO} PR #${PR_NUMBER}"
              case "${ACTION}-${PR_MERGED}-${PR_DRAFT}" in
                opened-true-*|reopened-true-*)
                  kind="🚀 新 PR（已合并历史变更）"; color="info" ;;
                closed-true-*)  kind="✅ PR 已合并";   color="info" ;;
                closed-false-*) kind="❌ PR 已关闭";   color="warning" ;;
                ready_for_review-*) kind="👀 PR 可评审"; color="info" ;;
                opened-false-true|reopened-false-true)
                  kind="📝 新 PR（草稿）"; color="comment" ;;
                opened-*|reopened-*) kind="🚀 新 PR"; color="info" ;;
              esac
              ;;
            issue_comment)
              title="${ISSUE_TITLE}"
              url="${COMMENT_URL}"
              actor="${COMMENT_USER}"
              body="$(flatten "${COMMENT_BODY:-}")"
              labels="${ISSUE_LABELS:-}"
              if [ "${IS_PR_COMMENT:-false}" = "true" ]; then
                ref="${REPO} PR #${ISSUE_NUMBER}"
                kind="💬 PR 新评论"
              else
                ref="${REPO}#${ISSUE_NUMBER}"
                kind="💬 Issue 新评论"
              fi
              color="comment"
              ;;
            workflow_dispatch)
              title="${INPUT_TITLE:-EasySplit 企业微信机器人连通性测试}"
              kind="🔔 测试消息"
              body="如果你收到这条消息，说明 EasySplit 仓库的 Issue / PR 提醒已经配置成功。"
              url="https://github.com/${REPO}/pulls"
              ref="${REPO}"
              color="info"
              ;;
          esac

          body="$(clip "${body}" 260)"

          content="**${kind}** <font color=\"${color}\">${ref}</font>
          > 标题：[${title}](${url})
          > 操作者：${actor}
          > 标签：${labels:-无}
          > 摘要：${body:-无}"

          payload="$(jq -n --arg content "$content" '{msgtype: "markdown", markdown: {content: $content}}')"
          response="$(curl -sS --max-time 15 -X POST \
            -H 'Content-Type: application/json' \
            -d "$payload" "$WEBHOOK_URL")"

          echo "WeCom response: ${response}"
          errcode="$(printf '%s' "$response" | jq -r '.errcode // empty')"
          if [ "$errcode" != "0" ]; then
            echo "::error::企业微信返回错误：${response}"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### WeCom notification"
            echo "- event: \`${{ github.event_name }}\` / \`${{ github.event.action }}\`"
            echo "- issue/PR: \`${{ github.repository }}#${{ github.event.issue.number || github.event.pull_request.number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
