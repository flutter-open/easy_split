name: Issue → WeCom

# 把仓库的 Issue 动态推送到企业微信群机器人。
# 需要在仓库 Secrets 中配置 WECOM_WEBHOOK_URL（见下方注释），密钥不会写进代码库。

on:
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      title:
        description: 测试消息标题
        required: false
        default: EasySplit 企业微信机器人连通性测试

permissions:
  contents: read
  issues: read

concurrency:
  group: wecom-issue-${{ github.event.issue.number || 'manual' }}
  cancel-in-progress: false

jobs:
  notify:
    # issue_comment 也会在 PR 评论时触发，这里只处理 Issue 评论。
    if: github.event_name != 'issue_comment' || !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Send markdown to WeCom
        env:
          # 仓库 Settings -> Secrets and variables -> Actions -> New repository secret
          # 名称：WECOM_WEBHOOK_URL
          # 值：  https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=***
          WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::error::缺少 WECOM_WEBHOOK_URL secret，请先到仓库 Settings -> Secrets and variables -> Actions 中添加。"
            exit 1
          fi

          # 摘要：压平换行、去掉首尾空白并截断，避免超出企业微信 4096 字节上限。
          flatten() {
            printf '%s' "$1" | tr '\r\n' '  ' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//'
          }
          clip() {
            local text="$1" max="${2:-260}"
            if [ "${#text}" -gt "$max" ]; then
              printf '%s…（已截断）' "${text:0:$max}"
            else
              printf '%s' "$text"
            fi
          }

          title="${INPUT_TITLE:-$ISSUE_TITLE}"
          url="${ISSUE_URL}"
          actor="${ISSUE_USER}"
          body="$(flatten "${ISSUE_BODY:-}")"
          kind="Issue 更新"
          color="info"
          labels="${ISSUE_LABELS:-}"

          case "${EVENT_NAME}" in
            issues)
              case "${ACTION}" in
                opened)   kind="🐛 新 Issue";     color="info" ;;
                reopened) kind="🔄 Issue 重新打开"; color="warning" ;;
                closed)   kind="✅ Issue 已关闭";   color="comment" ;;
              esac
              ;;
            issue_comment)
              kind="💬 Issue 新评论"
              color="comment"
              url="${COMMENT_URL}"
              actor="${COMMENT_USER}"
              body="$(flatten "${COMMENT_BODY:-}")"
              ;;
            workflow_dispatch)
              kind="🔔 测试消息"
              body="如果你收到这条消息，说明 EasySplit 仓库的 Issue 提醒已经配置成功。"
              url="https://github.com/${REPO}/issues"
              actor="${GITHUB_ACTOR:-workflow}"
              ;;
          esac

          body="$(clip "${body}" 260)"

          content="**${kind}** <font color=\"${color}\">${REPO}#${ISSUE_NUMBER:-}</font>
          > 标题：[${title}](${url})
          > 操作者：${actor}
          > 标签：${labels:-无}
          > 摘要：${body:-无}"

          payload="$(jq -n --arg content "$content" '{msgtype: "markdown", markdown: {content: $content}}')"
          response="$(curl -sS --max-time 15 -X POST \
            -H 'Content-Type: application/json' \
            -d "$payload" "$WEBHOOK_URL")"

          echo "WeCom response: ${response}"
          errcode="$(printf '%s' "$response" | jq -r '.errcode // empty')"
          if [ "$errcode" != "0" ]; then
            echo "::error::企业微信返回错误：${response}"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### WeCom issue notification"
            echo "- event: \`${{ github.event_name }}\` / \`${{ github.event.action }}\`"
            echo "- issue: \`${{ github.repository }}#${{ github.event.issue.number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
