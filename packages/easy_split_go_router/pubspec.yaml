name: easy_split_go_router
description: "GoRouter adapter for EasySplit: EasySplitGoRoute turns a GoRoute into a wide-screen split pane with built-in duplicate-route deduplication."
version: 0.1.3
repository: https://github.com/flutter-open/easy_split/tree/main/packages/easy_split_go_router
topics:
  - go-router
  - split-screen
  - foldable
  - adaptive-layout
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.27.0" # EasySplitPage.requestFocus passthrough requires Flutter 3.27+
dependencies:
  flutter:
    sdk: flutter
  easy_split: ^0.1.1
  go_router: ">=15.0.0 <19.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
