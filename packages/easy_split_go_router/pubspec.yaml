name: easy_split_go_router
description: EasySplit 的 GoRouter 适配：把 GoRoute 换成 EasySplitGoRoute 即可获得宽屏自动分栏与重复路由自动去重，页面代码零改动，兼容 go_router 13 及以上。
version: 0.1.0
repository: https://github.com/flutter-open/easy_split/tree/main/packages/easy_split_go_router
topics:
  - go-router
  - split-screen
  - foldable
  - adaptive-layout
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.27.0" # EasySplitPage.requestFocus 透传需 3.27+
dependencies:
  flutter:
    sdk: flutter
  easy_split: ^0.1.0
  go_router: ">=13.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
